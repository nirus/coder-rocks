<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 680 480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="680" height="480" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="340" y="32" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="14" font-weight="bold" text-anchor="middle">StreamingToolExecutor Pipeline</text>

  <!-- ═══ STATUS FLOW ═══ -->
  <text x="50" y="64" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">STATUS FLOW</text>

  <rect x="50" y="74" width="110" height="26" rx="13" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="105" y="91" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">queued</text>

  <line x1="160" y1="87" x2="190" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="198" y="74" width="110" height="26" rx="13" fill="#422006" stroke="#f59e0b" stroke-width="1"/>
  <text x="253" y="91" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">executing</text>

  <line x1="308" y1="87" x2="338" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="346" y="74" width="110" height="26" rx="13" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="401" y="91" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">completed</text>

  <line x1="456" y1="87" x2="486" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="494" y="74" width="110" height="26" rx="13" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="549" y="91" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">yielded</text>

  <!-- ═══ CONCURRENCY SECTION ═══ -->
  <text x="50" y="134" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="11" font-weight="bold">Concurrency Rules</text>

  <rect x="40" y="146" width="600" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>

  <!-- Left column: concurrent-safe -->
  <text x="60" y="168" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="9" font-weight="bold">CONCURRENT (parallel)</text>

  <rect x="60" y="178" width="180" height="22" rx="3" fill="#14532d"/>
  <text x="150" y="194" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Read file_a.ts</text>

  <rect x="60" y="206" width="180" height="22" rx="3" fill="#14532d"/>
  <text x="150" y="222" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Glob **/*.ts</text>

  <rect x="60" y="234" width="180" height="22" rx="3" fill="#14532d"/>
  <text x="150" y="250" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Grep "TODO"</text>

  <!-- Brace and label -->
  <text x="260" y="224" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="28">}</text>
  <text x="284" y="218" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">run at the</text>
  <text x="284" y="232" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">same time</text>

  <!-- Right column: exclusive -->
  <text x="400" y="168" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9" font-weight="bold">EXCLUSIVE (sequential)</text>

  <rect x="400" y="178" width="220" height="22" rx="3" fill="#450a0a"/>
  <text x="510" y="194" fill="#fca5a5" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Bash npm install</text>

  <line x1="510" y1="200" x2="510" y2="212" stroke="#475569" stroke-width="1" marker-end="url(#a4)"/>

  <rect x="400" y="218" width="220" height="22" rx="3" fill="#450a0a"/>
  <text x="510" y="234" fill="#fca5a5" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Edit config.ts</text>

  <text x="510" y="260" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">waits for exclusive lock</text>

  <!-- ═══ ERROR CASCADE SECTION ═══ -->
  <text x="50" y="302" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="11" font-weight="bold">Error Cascade</text>

  <rect x="40" y="314" width="600" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>

  <!-- Bash error row -->
  <rect x="60" y="326" width="150" height="22" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="135" y="342" fill="#fca5a5" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Bash error</text>
  <line x1="210" y1="337" x2="268" y2="337" stroke="#ef4444" stroke-width="1" marker-end="url(#a4)"/>
  <text x="278" y="342" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9">abort ALL sibling tools</text>

  <!-- User interrupt row -->
  <rect x="60" y="356" width="150" height="22" rx="3" fill="#422006" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="135" y="372" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">User interrupt</text>
  <line x1="210" y1="367" x2="268" y2="367" stroke="#f59e0b" stroke-width="1" marker-end="url(#a4)"/>
  <text x="278" y="372" fill="#f59e0b" font-family="'SF Mono','Fira Code',monospace" font-size="9">cancel 'cancel'-behavior only</text>

  <!-- ═══ RESULT ORDERING ═══ -->
  <text x="50" y="418" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="11" font-weight="bold">Result Ordering</text>

  <text x="50" y="440" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="10">Results buffered and emitted</text>
  <text x="324" y="440" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10" font-weight="bold"> IN ORDER</text>

  <text x="50" y="458" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="10">regardless of completion order.</text>

  <text x="50" y="476" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">Progress events yield immediately (no buffering).</text>
</svg>
