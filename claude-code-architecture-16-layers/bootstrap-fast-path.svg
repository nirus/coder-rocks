<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 680 580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="680" height="580" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="340" y="32" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="14" font-weight="bold" text-anchor="middle">Bootstrap Fast-Path Decision Tree</text>
  <text x="340" y="50" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">cli.tsx — exits before loading 1300+ modules</text>

  <!-- Entry node -->
  <rect x="250" y="66" width="180" height="32" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="87" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="12" text-anchor="middle">process.argv</text>

  <!-- Central spine (dashed) -->
  <line x1="340" y1="98" x2="340" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Row 1: version flag -->
  <rect x="40" y="116" width="190" height="30" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="136" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">--version / -v</text>
  <line x1="230" y1="131" x2="340" y2="131" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="131" x2="410" y2="131" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="136" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10">print VERSION, exit</text>

  <!-- Row 2: daemon worker -->
  <rect x="40" y="158" width="190" height="30" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="178" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">--daemon-worker</text>
  <line x1="230" y1="173" x2="340" y2="173" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="173" x2="410" y2="173" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="178" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10">runDaemonWorker()</text>

  <!-- Row 3: rc | bridge -->
  <rect x="40" y="200" width="190" height="30" rx="5" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="220" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">rc | bridge | sync</text>
  <line x1="230" y1="215" x2="340" y2="215" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="215" x2="410" y2="215" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="220" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10">auth → bridgeMain()</text>

  <!-- Row 4: daemon -->
  <rect x="40" y="242" width="190" height="30" rx="5" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="262" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">daemon</text>
  <line x1="230" y1="257" x2="340" y2="257" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="257" x2="410" y2="257" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="262" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10">daemonMain()</text>

  <!-- Row 5: ps | logs -->
  <rect x="40" y="284" width="190" height="30" rx="5" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="304" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">ps | logs | attach</text>
  <line x1="230" y1="299" x2="340" y2="299" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="299" x2="410" y2="299" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="304" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10">bg session handler</text>

  <!-- Row 6: worktree tmux -->
  <rect x="40" y="326" width="190" height="30" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="346" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">--worktree --tmux</text>
  <line x1="230" y1="341" x2="340" y2="341" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="341" x2="410" y2="341" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="346" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="10">exec into tmux</text>

  <!-- Row 7: [everything else] — the slow path -->
  <rect x="40" y="386" width="190" height="30" rx="5" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="135" y="406" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle">[everything else]</text>
  <line x1="230" y1="401" x2="340" y2="401" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="340" y1="401" x2="340" y2="440" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Full CLI box -->
  <rect x="140" y="448" width="400" height="50" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="470" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="12" text-anchor="middle" font-weight="bold">import main.tsx → cliMain()</text>
  <text x="340" y="488" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">1300+ modules, Commander, Ink TUI</text>

  <!-- Legend -->
  <rect x="40" y="520" width="12" height="12" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="531" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">CLI flag fast path</text>

  <rect x="230" y="520" width="12" height="12" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="248" y="531" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">Subcommand fast path</text>

  <rect x="430" y="520" width="12" height="12" rx="2" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="448" y="531" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">Full CLI load path</text>

  <text x="340" y="562" fill="#475569" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">8+ fast paths exit before full CLI is imported</text>
</svg>
