<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 680 700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="680" height="700" fill="url(#bg)" rx="12"/>

  <text x="340" y="32" fill="#e2e8f0" font-family="'SF Mono','Fira Code',monospace" font-size="14" font-weight="bold" text-anchor="middle">Dream Lifecycle</text>
  <text x="340" y="50" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">From turn completion to memory consolidation</text>

  <!-- Trigger -->
  <rect x="220" y="66" width="240" height="30" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="340" y="86" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">User completes a query</text>

  <line x1="340" y1="96" x2="340" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Gate cascade -->
  <rect x="140" y="120" width="400" height="170" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="160" y="140" fill="#f59e0b" font-family="'SF Mono','Fira Code',monospace" font-size="10" font-weight="bold">GATE CASCADE (cheapest first)</text>

  <!-- Gate rows -->
  <text x="160" y="162" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">1. Feature gate</text>
  <text x="380" y="162" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">in-memory</text>
  <text x="500" y="162" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9">NO? exit</text>

  <text x="160" y="182" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">2. Time gate (24h)</text>
  <text x="380" y="182" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">1 stat()</text>
  <text x="500" y="182" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9">NO? exit</text>

  <text x="160" y="202" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">3. Scan throttle (10m)</text>
  <text x="380" y="202" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">in-memory</text>
  <text x="500" y="202" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9">NO? exit</text>

  <text x="160" y="222" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">4. Session gate (5+)</text>
  <text x="380" y="222" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">readdir</text>
  <text x="500" y="222" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9">NO? exit</text>

  <text x="160" y="242" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="9">5. Lock available?</text>
  <text x="380" y="242" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="9">stat+read</text>
  <text x="500" y="242" fill="#ef4444" font-family="'SF Mono','Fira Code',monospace" font-size="9">NO? exit</text>

  <text x="160" y="276" fill="#22c55e" font-family="'SF Mono','Fira Code',monospace" font-size="9">All gates pass</text>
  <line x1="280" y1="270" x2="340" y2="270" stroke="#22c55e" stroke-width="1"/>

  <line x1="340" y1="290" x2="340" y2="314" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Fork agent -->
  <rect x="170" y="318" width="340" height="36" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="335" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="11" text-anchor="middle" font-weight="bold">Fork Agent (background)</text>
  <text x="340" y="349" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="8" text-anchor="middle">isolated context, shared prompt cache</text>

  <line x1="340" y1="354" x2="340" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4 phases -->
  <rect x="100" y="382" width="480" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="120" y="402" fill="#a78bfa" font-family="'SF Mono','Fira Code',monospace" font-size="10" font-weight="bold">4-PHASE CONSOLIDATION</text>

  <rect x="120" y="412" width="210" height="22" rx="3" fill="#1e3a5f"/>
  <text x="225" y="428" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">1. Orient: ls memory, read index</text>

  <rect x="120" y="440" width="210" height="22" rx="3" fill="#1e3a5f"/>
  <text x="225" y="456" fill="#93c5fd" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">2. Gather: logs, grep transcripts</text>

  <rect x="350" y="412" width="210" height="22" rx="3" fill="#14532d"/>
  <text x="455" y="428" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">3. Consolidate: write/merge</text>

  <rect x="350" y="440" width="210" height="22" rx="3" fill="#14532d"/>
  <text x="455" y="456" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">4. Prune: index under 200 lines</text>

  <text x="340" y="496" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="8" text-anchor="middle">UI flips to "updating" on first Edit/Write tool use</text>

  <line x1="340" y1="512" x2="340" y2="536" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Outcomes -->
  <rect x="60" y="540" width="180" height="44" rx="5" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="150" y="558" fill="#86efac" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">Success</text>
  <text x="150" y="576" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="8" text-anchor="middle">"Improved N memories"</text>

  <rect x="250" y="540" width="180" height="44" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="558" fill="#fca5a5" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">Failure</text>
  <text x="340" y="576" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="8" text-anchor="middle">rollback lock, retry in 10m</text>

  <rect x="440" y="540" width="180" height="44" rx="5" fill="#422006" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="530" y="558" fill="#fcd34d" font-family="'SF Mono','Fira Code',monospace" font-size="10" text-anchor="middle">User Kill</text>
  <text x="530" y="576" fill="#64748b" font-family="'SF Mono','Fira Code',monospace" font-size="8" text-anchor="middle">abort + rollback lock</text>

  <!-- Footer note -->
  <text x="340" y="620" fill="#475569" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Typical cost per turn: 1 in-memory check + 1 stat()</text>
  <text x="340" y="638" fill="#475569" font-family="'SF Mono','Fira Code',monospace" font-size="9" text-anchor="middle">Fires only when 24h + 5 sessions have accumulated</text>

  <!-- Legend -->
  <rect x="140" y="660" width="10" height="10" rx="2" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <text x="156" y="670" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="8">Read-only</text>

  <rect x="280" y="660" width="10" height="10" rx="2" fill="none" stroke="#22c55e" stroke-width="1"/>
  <text x="296" y="670" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="8">Write (memory only)</text>

  <rect x="440" y="660" width="10" height="10" rx="2" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <text x="456" y="670" fill="#94a3b8" font-family="'SF Mono','Fira Code',monospace" font-size="8">Background agent</text>
</svg>
