<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="340" rx="12" fill="url(#bg)"/>

  <!-- Section 1: Before first keypress -->
  <text x="30" y="35" fill="#94a3b8" font-size="13">input buffer (before first keypress):</text>

  <!-- Buffer bytes - residual -->
  <rect x="30" y="50" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="52" y="73" text-anchor="middle" fill="#fca5a5" font-size="13">\e</text>
  <rect x="80" y="50" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="102" y="73" text-anchor="middle" fill="#fca5a5" font-size="13">[</text>
  <rect x="130" y="50" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="152" y="73" text-anchor="middle" fill="#fca5a5" font-size="13">&gt;</text>
  <rect x="180" y="50" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="202" y="73" text-anchor="middle" fill="#fca5a5" font-size="13">1</text>
  <rect x="230" y="50" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="252" y="73" text-anchor="middle" fill="#fca5a5" font-size="13">u</text>

  <text x="290" y="73" fill="#64748b" font-size="12">← residual push from CMUX surface init</text>

  <!-- Section 2: User presses Ctrl+C -->
  <text x="30" y="125" fill="#94a3b8" font-size="13">user presses Ctrl+C:</text>

  <!-- Residual bytes -->
  <rect x="30" y="140" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="52" y="163" text-anchor="middle" fill="#fca5a5" font-size="13">\e</text>
  <rect x="80" y="140" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="102" y="163" text-anchor="middle" fill="#fca5a5" font-size="13">[</text>
  <rect x="130" y="140" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="152" y="163" text-anchor="middle" fill="#fca5a5" font-size="13">&gt;</text>
  <rect x="180" y="140" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="202" y="163" text-anchor="middle" fill="#fca5a5" font-size="13">1</text>
  <rect x="230" y="140" width="44" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="252" y="163" text-anchor="middle" fill="#fca5a5" font-size="13">u</text>

  <!-- Actual Ctrl+C bytes -->
  <rect x="290" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="312" y="163" text-anchor="middle" fill="#86efac" font-size="13">\e</text>
  <rect x="340" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="362" y="163" text-anchor="middle" fill="#86efac" font-size="13">[</text>
  <rect x="390" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="412" y="163" text-anchor="middle" fill="#86efac" font-size="13">9</text>
  <rect x="440" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="462" y="163" text-anchor="middle" fill="#86efac" font-size="13">9</text>
  <rect x="490" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="512" y="163" text-anchor="middle" fill="#86efac" font-size="13">;</text>
  <rect x="540" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="562" y="163" text-anchor="middle" fill="#86efac" font-size="13">5</text>
  <rect x="590" y="140" width="44" height="36" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="612" y="163" text-anchor="middle" fill="#86efac" font-size="13">u</text>

  <!-- Arrow pointing to actual Ctrl+C -->
  <line x1="312" y1="190" x2="312" y2="210" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="230" text-anchor="middle" fill="#fbbf24" font-size="12">↑ actual Ctrl+C</text>

  <!-- Section 3: ZLE result -->
  <text x="30" y="275" fill="#94a3b8" font-size="13">ZLE tries to match from the start:</text>

  <rect x="30" y="290" width="250" height="32" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="155" y="311" text-anchor="middle" fill="#fca5a5" font-size="13">\e [ &gt; 1 u</text>
  <text x="300" y="311" fill="#ef4444" font-size="13">→ no binding → printed as junk</text>
</svg>
