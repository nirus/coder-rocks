<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="12" fill="url(#bg)"/>

  <!-- Ghostty Box -->
  <rect x="40" y="40" width="190" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="80" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">Ghostty</text>
  <text x="135" y="105" text-anchor="middle" fill="#64748b" font-size="13">(outer terminal)</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="90" x2="290" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CMUX Box -->
  <rect x="300" y="40" width="190" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="395" y="80" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">CMUX</text>
  <text x="395" y="105" text-anchor="middle" fill="#64748b" font-size="13">(libghostty)</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="90" x2="550" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Zsh Box -->
  <rect x="560" y="40" width="190" height="100" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="655" y="80" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">zsh</text>
  <text x="655" y="105" text-anchor="middle" fill="#64748b" font-size="13">(inner shell)</text>

  <!-- Labels below -->
  <text x="135" y="175" text-anchor="middle" fill="#93c5fd" font-size="13">keys</text>
  <text x="395" y="175" text-anchor="middle" fill="#fcd34d" font-size="13">CSI u?</text>
  <text x="655" y="175" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">WTF?</text>

  <!-- Connecting dots -->
  <circle cx="135" cy="155" r="2" fill="#475569"/>
  <circle cx="395" cy="155" r="2" fill="#475569"/>
  <circle cx="655" cy="155" r="2" fill="#475569"/>
</svg>
